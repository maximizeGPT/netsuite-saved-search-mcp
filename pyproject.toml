[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netsuite-saved-search-mcp"
version = "0.1.1"
description = "MCP server exposing NetSuite saved search exports as a structured query interface for Claude"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Mohammed Wasif"}]
keywords = ["mcp", "model-context-protocol", "netsuite", "claude", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=1.0",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/maximizeGPT/netsuite-saved-search-mcp"
Repository = "https://github.com/maximizeGPT/netsuite-saved-search-mcp"
Issues = "https://github.com/maximizeGPT/netsuite-saved-search-mcp/issues"

[project.scripts]
netsuite-saved-search-mcp = "netsuite_saved_search_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netsuite_saved_search_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-python-dateutil>=2.9",
    "lxml-stubs>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["netsuite_saved_search_mcp"]

[[tool.mypy.overrides]]
module = ["dateutil.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]
